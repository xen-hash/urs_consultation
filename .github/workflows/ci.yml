name: CI

# Two independent jobs, because the two halves of this repo deploy
# independently — the backend to Render, the frontend to Vercel — and a broken
# stylesheet should not hide a broken query.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff and pytest
    runs-on: ubuntu-latest

    services:
      # The suite runs against a real PostgreSQL. The data layer is
      # Postgres-specific — JSONB casts, ON CONFLICT, %s::timestamp — so a
      # SQLite stand-in would be testing a different program than the one that
      # ships. 16 matches what Neon and Supabase serve.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: urs
          POSTGRES_PASSWORD: urs
          POSTGRES_DB: ursdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U urs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # backend/runtime.txt pins 3.11 for the deploy; match it here so CI
          # cannot pass on a version the host will never run.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://urs:urs@localhost:5432/ursdb_test
        run: pytest

  frontend:
    name: Frontend — eslint, vitest and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # The build is a test in its own right: it is the only thing that
        # resolves every import and runs the PWA plugin over the result.
        run: npm run build
