services:
  - type: web
    name: urs-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gevent -w 1 --timeout 120 --bind 0.0.0.0:$PORT app:app

    # Render polls this to decide whether a deploy came up. Without it a boot
    # failure -- which is now a real possibility, since the app refuses to
    # start on default secrets -- can still be marked live.
    healthCheckPath: /api/health

    envVars:
      # Single Postgres connection string, e.g. from Neon or Supabase:
      #   postgresql://user:pass@ep-xyz.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Signs every session token. A known value here means anyone can forge a
      # session for any role, so let Render generate it.
      - key: SECRET_KEY
        generateValue: true

      # Comma-separated frontend origins allowed to call this API. Never "*".
      - key: ALLOWED_ORIGINS
        sync: false

      # Administrator credentials. Prefer ADMIN_PASSWORD_HASH (a bcrypt hash) so
      # the plaintext never exists in the environment:
      #   python -c "import bcrypt;print(bcrypt.hashpw(b'YOUR-PASSWORD', bcrypt.gensalt()).decode())"
      # These used to be committed here as "admin123"; the app now refuses to
      # start on that value.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false

      # Who may register as a student. Empty accepts any address; set this to
      # the school's domain and only school addresses get through.
      - key: STUDENT_EMAIL_DOMAINS
        sync: false

      # Optional. Defaults are in config.py.
      #   SESSION_TTL_HOURS  how long a session token stays valid (default 12)
      #   MAX_CONTENT_MB     largest accepted request body (default 8); profile
      #                      photos arrive as base64, so this is the ceiling on
      #                      one upload
      # - key: SESSION_TTL_HOURS
      #   value: "12"
      # - key: MAX_CONTENT_MB
      #   value: "8"
