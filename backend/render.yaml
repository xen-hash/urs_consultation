services:
  - type: web
    name: urs-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gevent -w 1 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      # Single Postgres connection string, e.g. from Neon or Supabase:
      #   postgresql://user:pass@ep-xyz.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: KIOSK_PASSWORD
        value: admin123
      - key: ADMIN_PASSWORD
        value: admin123
